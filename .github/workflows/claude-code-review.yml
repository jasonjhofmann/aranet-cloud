name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Re-reviewing on every push to a PR is the single largest avoidable Claude
# spend in this repo; keep only the newest run per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Two gates, both deliberate:
    #
    # 1. Fork PRs get no secrets under `pull_request`, so
    #    CLAUDE_CODE_OAUTH_TOKEN would be empty and the job would fail with a
    #    confusing error on every drive-by PR to this PUBLIC repo. Skip
    #    cleanly instead. (Failure-noise control, not a quota control: the
    #    action already refuses non-write actors on its own.)
    #    Do NOT "fix" fork PRs by switching to `pull_request_target` -- that
    #    hands the token to fork-authored content and turns this into a
    #    prompt-injection sink.
    #
    # 2. Dependabot PRs are skipped on purpose. Dependabot pastes UPSTREAM
    #    VENDORS' release notes and changelogs into the PR body, so reviewing
    #    them feeds third-party text nobody vetted to an agent holding this
    #    account's Claude credential. Bounded today by the read-only
    #    permissions below, but the surface is not worth the review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # NOTE: this block scopes the GITHUB_TOKEN only. It is NOT a containment
    # boundary for Claude's own credential (claude_code_oauth_token below);
    # Claude's reach is set by its own tooling, not by these lines. Do not read
    # "contents: read" as "Claude cannot write".
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

