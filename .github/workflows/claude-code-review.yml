name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Re-reviewing on every push to a PR is the single largest avoidable Claude
# spend in this repo; keep only the newest run per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs get no secrets under `pull_request`, so CLAUDE_CODE_OAUTH_TOKEN
    # would be empty and the job would fail with a confusing error on every
    # drive-by PR to this PUBLIC repo. Skip cleanly instead, and keep review
    # spend to branches in this repository (plus Dependabot, which is why
    # allowed_bots is set below). Note this is failure-noise control, not a
    # quota control: the action itself already refuses non-write actors.
    # INTERIM: Dependabot-triggered runs read the Dependabot secret store,
    # where CLAUDE_CODE_OAUTH_TOKEN is not set, so the action can never
    # authenticate and hard-fails. Skip (neutral) instead of a red X until
    # the token is added as a Dependabot secret:
    #   gh secret set CLAUDE_CODE_OAUTH_TOKEN --app dependabot -R <repo>
    # Then drop the second conjunct -- allowed_bots below makes it run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action hard-fails on PRs opened by bots (e.g. every
          # Dependabot PR): "Workflow initiated by non-human actor".
          allowed_bots: dependabot
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

